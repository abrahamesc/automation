---
- name: Create AD Forest and promote server to DC
  hosts: win
  vars_files:
    - vars_win.yml
  tasks:
    - name: Create Domain Controller
      microsoft.ad.domain:
        dns_domain_name: "{{ domain_name }}"
        domain_netbios_name: "{{ net_bios_name }}"
        safe_mode_password: Vpn12345
        reboot: true

    - name: Reboot
      ansible.windows.win_reboot:
      when: domain_install.reboot_required
